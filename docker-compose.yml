services:
  devbox:
    build: .
    image: ${DEVBOX_IMAGE:-vscode-devbox}
    container_name: ${CONTAINER_NAME:-vscode-devbox}
    environment:
      - TZ=${TZ:-UTC}
      - VERBOSE_LOGS=${VERBOSE_LOGS:-true}
      - "GIT_USER_NAME=${GIT_USER_NAME:-}"
      - "GIT_USER_EMAIL=${GIT_USER_EMAIL:-}"
      - "SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}"
      - UPSTREAM_DNS=${UPSTREAM_DNS:-}
      - "DNS_ENCRYPTED_SERVERS=${DNS_ENCRYPTED_SERVERS:-}"
      - DNS_ENCRYPTED_VIA_SOCKS=${DNS_ENCRYPTED_VIA_SOCKS:-false}
      - DNS_CACHE_ENABLED=${DNS_CACHE_ENABLED:-true}
      - DNS_CACHE_TTL=${DNS_CACHE_TTL:-300}
      - IPSET_TTL=${IPSET_TTL:-3600}
      - DNS_FORCE_REDIRECT=${DNS_FORCE_REDIRECT:-true}
      - PROXY_ENABLED=${PROXY_ENABLED:-true}
      - PROXY_ALL=${PROXY_ALL:-false}
      - SOCKS_PROXY_HOST=${SOCKS_PROXY_HOST:-}
      - SOCKS_PROXY_PORT=${SOCKS_PROXY_PORT:-10808}
      - SOCKS_PROXY_TYPE=${SOCKS_PROXY_TYPE:-socks5}
      - "PROXY_EXTRA_DOMAINS=${PROXY_EXTRA_DOMAINS:-}"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - ${UPSTREAM_DNS:-1.1.1.1}
    ports:
      - "${SSH_BIND_IP:-127.0.0.1}:${SSH_PORT:-2222}:22"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      - ./volumes/vscode-server:/home/dev/.vscode-server
      - ./volumes/gemini:/home/dev/.gemini
      - ./volumes/antigravity-config:/home/dev/.config/antigravity
      - ./volumes/nvm:/home/dev/.nvm
      - ./volumes/nuget:/home/dev/.nuget
    restart: unless-stopped
