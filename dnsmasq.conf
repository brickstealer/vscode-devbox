# Listen on localhost only
listen-address=127.0.0.1

# Upstream DNS (перезаписывается переменной UPSTREAM_DNS в entrypoint.sh)
filter-AAAA
server=1.1.1.1
# Don't read /etc/resolv.conf for upstream servers
no-resolv
# Cache size (helps with performance)
#cache-size=1000

# GitHub domains (Antigravity extensions)
ipset=/github.com/special_proxy
ipset=/githubusercontent.com/special_proxy

# Microsoft domains (VS Code core components)
ipset=/aka.ms/special_proxy
ipset=/vscode-cdn.net/special_proxy
ipset=/vscode.download.prss.microsoft.com/special_proxy
ipset=/visualstudio.com/special_proxy
ipset=/vsassets.io/special_proxy

# IPdetects
ipset=/2ip.io/special_proxy
ipset=/ipinfo.io/special_proxy

