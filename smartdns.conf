# Слушаем только localhost (UDP и TCP для перехваченных DNS-запросов)
bind 127.0.0.1:53
bind-tcp 127.0.0.1:53

# Производительность и совместимость с ipset/redsocks
# --- BEGIN CACHE (auto-managed from .env) ---
cache-size 4096
cache-persist no
serve-expired no
rr-ttl 300
rr-ttl-reply-max 300
ipset-timeout no
# --- END CACHE ---
speed-check-mode none
dualstack-ip-selection no
force-AAAA-SOA yes
force-qtype-SOA 64 65

# Сертификаты для DoH / DoT
ca-file /etc/ssl/certs/ca-certificates.crt

# Логирование
log-level warn
log-file /var/log/smartdns/smartdns.log
log-size 128k
log-num 2

# === Upstream DNS / DoH / DoT ===
# Если в .env переменные UPSTREAM_DNS и DNS_ENCRYPTED_SERVERS не заданы,
# SmartDNS использует настройки прямо из этого файла.
# Если заданы в .env, блок BEGIN/END UPSTREAMS ниже обновляется автоматически при старте контейнера.
#
# Примеры для ручной настройки:
#   server 1.1.1.1
#   server 1.1.1.1 -bootstrap-dns -exclude-default-group
#   server https://dns.google/dns-query
#   server tls://1.1.1.1:853
#   proxy-server socks5://10.0.0.2:10808 -name upstream_socks
#   server https://dns.google/dns-query -proxy upstream_socks
# --- BEGIN UPSTREAMS (auto-managed when .env DNS vars are set) ---
server 1.1.1.1
# --- END UPSTREAMS ---

# === Домены для селективного проксирования (ipset special_proxy) ===
# GitHub domains (Antigravity extensions)
ipset /github.com/special_proxy
ipset /githubusercontent.com/special_proxy

# Microsoft domains (VS Code core components)
ipset /aka.ms/special_proxy
ipset /vscode-cdn.net/special_proxy
ipset /vscode.download.prss.microsoft.com/special_proxy
ipset /visualstudio.com/special_proxy
ipset /vsassets.io/special_proxy

# IPdetects
ipset /2ip.io/special_proxy
ipset /ipinfo.io/special_proxy

# Google
ipset /antigravity.com/special_proxy
ipset /antigravity.google/special_proxy
ipset /run.app/special_proxy
ipset /google.com/special_proxy
ipset /googleapis.com/special_proxy
ipset /gstatic.com/special_proxy
