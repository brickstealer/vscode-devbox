name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, push & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate scripts & compose config
        run: |
          bash -n entrypoint.sh
          shellcheck --severity=warning entrypoint.sh
          cp .env.example .env
          docker compose config -q
          rm -f .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release bundle
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE_REPO="ghcr.io/$(printf '%s' "${REPO}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_DIR="vscode-devbox-${TAG}"
          mkdir -p "${BUNDLE_DIR}"
          cp Dockerfile docker-compose.yml entrypoint.sh smartdns.conf redsocks.conf authorized_keys README.md "${BUNDLE_DIR}/"
          sed "s|^# DEVBOX_IMAGE=.*|DEVBOX_IMAGE=${IMAGE_REPO}:${TAG}|" .env.example > "${BUNDLE_DIR}/.env.example"
          tar -czf "${BUNDLE_DIR}.tar.gz" "${BUNDLE_DIR}"
          sha256sum "${BUNDLE_DIR}.tar.gz" > "${BUNDLE_DIR}.tar.gz.sha256"
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES_FILE="$(mktemp)"
          cat <<EOF > "${NOTES_FILE}"
          ## Docker Image

          \`\`\`bash
          docker pull ${IMAGE_REPO}:${TAG}
          \`\`\`

          ### Быстрый запуск из готового образа

          1. Скачайте \`vscode-devbox-${TAG}.tar.gz\` из ассетов релиза и распакуйте:
             \`\`\`bash
             tar -xzf vscode-devbox-${TAG}.tar.gz && cd vscode-devbox-${TAG}
             cp .env.example .env
             \`\`\`
          2. Укажите свои значения в \`.env\` (\`SSH_PUBLIC_KEY\`, \`GIT_USER_NAME\`, \`GIT_USER_EMAIL\`, при необходимости \`UPSTREAM_DNS\` / \`DNS_ENCRYPTED_SERVERS\` / \`SOCKS_PROXY_HOST\`).
          3. Запустите контейнер:
             \`\`\`bash
             docker compose pull && docker compose up -d
             \`\`\`

          **Digest:** \`${BUILD_DIGEST}\`
          EOF

          GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq '.body' 2>/dev/null || true)"
          if [ -n "${GENERATED_NOTES}" ]; then
            printf '\n%s\n' "${GENERATED_NOTES}" >> "${NOTES_FILE}"
          fi

          gh release create "${TAG}" \
            "vscode-devbox-${TAG}.tar.gz" \
            "vscode-devbox-${TAG}.tar.gz.sha256" \
            --title "vscode-devbox ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            ${PRERELEASE_FLAG}
